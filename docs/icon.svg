<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Unscan app icon: 文 (text) under a scanner beam, set in type
       above it, on white paper, and still the scan's pixels below it, on
       yellowed paper. 文 is Noto Serif SC Bold's (OFL-1.1). Render it into
       the app, which MyGo takes from resources/icon.png, with:
       rsvg-convert -w 1024 -h 1024 docs/icon.svg -o resources/icon.png -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="544.0"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F5FA"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEE3C8"/>
      <stop offset="1" stop-color="#E2D3B0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3D8BFF" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beamglow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
